name: Deploy to GitHub Pages

# Deploys only the commit that a successful CI run verified on develop. Pull-request runs never deploy.
#
# Repository preconditions (otherwise deployment silently never happens or is rejected):
# - `workflow_run` triggers run the workflow file from the repository's DEFAULT branch, so the default branch must be
#   `develop` (this file must exist there). Push `develop` first to the empty remote; do not create `main` first.
# - Settings -> Environments -> github-pages: the deployment branch rule must allow `develop` (also for manual dispatch).
# - Settings -> Pages -> Source = GitHub Actions.
# Manual workflow_dispatch deploys the current develop head WITHOUT the CI gate (it only builds and runs verify:pwa).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # workflow_run: CI must have succeeded for a push to develop. workflow_dispatch: only when run from develop.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.head_repository.full_name == github.repository
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'develop')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Rebuild at the exact verified commit (simple and robust: no cross-workflow artifact plumbing). For manual
      # dispatch, github.sha is the develop head the run was started from.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify:pwa
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
